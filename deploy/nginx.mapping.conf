# nginx för mapping.kchd.se: servar Vite-byggd SPA + proxar API:t till mapping-api.
#
# Klurigheten: /projects och /catalog används BÅDE som API-vägar (XHR/fetch, Accept: json)
# OCH som webb-rutter (browser-navigering/refresh, Accept: text/html). Samma vite-proxy-trick:
# är Accept text/html → servera SPA:n; annars → proxa till API:t.

map $http_accept $mapping_wants_html {
    default 0;
    "~*text/html" 1;
}

upstream mapping_api { server mapping-api:8000; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Bakom Caddy (HTTPS): relativa redirects.
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 50m;

    # Gemensamma proxy-inställningar (ärvs in i location-blocken nedan).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Rena API-vägar (alltid till Python) ---
    location = /health        { proxy_pass http://mapping_api; }
    location = /openapi.json  { proxy_pass http://mapping_api; }
    location /docs            { proxy_pass http://mapping_api; }
    location /redoc           { proxy_pass http://mapping_api; }

    # --- /projects och /catalog: SPA vid browser-navigering, annars API ---
    location ~ ^/(projects|catalog)(/|$) {
        if ($mapping_wants_html) { rewrite ^ /index.html last; }
        proxy_pass http://mapping_api;
    }

    # --- SPA: allt annat → index.html (React-router) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
