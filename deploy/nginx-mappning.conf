# nginx-serverblock för v1 — webb + API bakom EN lösenordsskyddad adress.
# Kopiera till /etc/nginx/sites-available/mappning, symlänka till sites-enabled.
#
# Samexisterar med Entryscape-poc: detta är ett eget server-block på en egen
# subdomän och påverkar inte andra siter. API:t lyssnar bara på 127.0.0.1:8010.

server {
    listen 80;
    # ── ÄNDRA: din subdomän ───────────────────────────────────────
    server_name mappning.EXEMPEL.se;
    # ──────────────────────────────────────────────────────────────

    # Lösenordsskydd (internt) — gäller HELA sajten, både webb och API.
    # Detta täcker samtidigt över v1:s simulerade inloggning: ingen obehörig
    # kommer ens fram till verktyget.
    auth_basic           "KCHD Mappning – internt";
    auth_basic_user_file /etc/nginx/.htpasswd-mappning;

    # Statiska webbfiler (Vite-bygget)
    root  /opt/mappning/apps/web/ui/dist;
    index index.html;

    # Alla backend-vägar ligger under /projects och /catalog → uvicorn
    location /projects {
        proxy_pass       http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /catalog {
        proxy_pass       http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Allt annat = webben. SPA-fallback så att direktlänkar/refresh funkar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: kör `sudo certbot --nginx -d mappning.EXEMPEL.se` efteråt så lägger
# certbot till TLS automatiskt (rekommenderas — annars går lösenordet i klartext).
